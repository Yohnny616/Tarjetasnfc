<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creador de páginas NFC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
<script id="cfg" type="application/json"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#f6f5f2;--fg:#1d1d1b;--mut:#6b6a66;--line:#dcdad4;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--fg:#f1f0ec;--mut:#a09f9a;--line:#33322f;--card:#202020}}
:root[data-theme="dark"]{--bg:#161615;--fg:#f1f0ec;--mut:#a09f9a;--line:#33322f;--card:#202020}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.45 Outfit,system-ui,sans-serif}
#gen{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;font-weight:800;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 18px}
.f{display:block;margin:0 0 12px}
.f span{display:block;font-size:14px;color:var(--mut);margin-bottom:4px}
.f input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit}
.f input:focus,button:focus-visible,a:focus-visible{outline:3px solid #2f7bff;outline-offset:2px}
.f input[type=color]{padding:2px;height:46px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:grid;gap:10px;margin:18px 0}
button.b{padding:14px;border:0;border-radius:12px;font:700 16px Outfit,system-ui,sans-serif;background:var(--fg);color:var(--bg);cursor:pointer}
button.b.alt{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
#msg{min-height:20px;color:var(--mut);font-size:14px}
#qrbox{text-align:center;margin:10px 0}
#qrbox img{width:200px;height:200px;image-rendering:pixelated;background:#fff;padding:10px;border-radius:12px}
.hlp{font-size:13px;color:var(--mut);margin:-4px 0 12px}
.hlp a{color:inherit;text-decoration:underline}
.gbox{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;margin:0 0 14px}
.gbox[hidden]{display:none}
.gbox span{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
.gbox code{display:block;font:13px/1.35 ui-monospace,Menlo,monospace;word-break:break-all;margin-bottom:10px}
.gact{display:grid;grid-template-columns:1fr 1fr;gap:8px}
a.b{display:block;text-align:center;text-decoration:none;padding:14px;border-radius:12px;font:700 16px Outfit,system-ui,sans-serif;color:var(--fg);border:1.5px solid var(--line)}
.prev{margin-top:22px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--bg)}
.ptitle{margin:26px 0 8px;font-weight:700}
/* Página del cliente */
#app{--ac:#111}
.pg{max-width:440px;margin:0 auto;padding:36px 20px 40px;text-align:center}
.pg h2{font-size:30px;font-weight:800;line-height:1.1;margin:0 0 8px;letter-spacing:-.01em;color:var(--on,#fff)}
.pg p.t{color:var(--on,#fff);opacity:.85;margin:0 0 26px}
.cta{display:block;text-decoration:none;background:#fff;color:#1d1d1b;border-radius:18px;padding:22px 16px;margin-bottom:22px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.cta b{display:block;font-size:21px;font-weight:800}
.cta i{display:block;font-style:normal;letter-spacing:5px;font-size:24px;margin-bottom:6px;color:#FBBC04}
.cta small{color:#6b6a66;font-size:14px}
.lk{display:flex;align-items:center;gap:14px;text-align:left;text-decoration:none;color:#1d1d1b;background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;font-weight:600;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.lk svg{flex:none;width:40px;height:40px;display:block}
</style>
</head>
<body>
<div id="gen">
  <h1>Creador de páginas NFC</h1>
  <p class="sub">Llena los datos del negocio, muéstrale la vista previa y descarga su página.</p>
  <label class="f"><span>Nombre del negocio</span><input id="n" placeholder="Barbería Estilo Latino"></label>
  <label class="f"><span>Frase corta (opcional)</span><input id="t" placeholder="Gracias por visitarnos"></label>
  <label class="f"><span>Place ID de Google (o link de reseñas completo)</span><input id="g" placeholder="ChIJ... o https://g.page/r/..."></label>
  <p class="hlp">¿No tienes el Place ID? <a href="https://developers.google.com/maps/documentation/places/web-service/place-id" target="_blank" rel="noopener">Ábrelo en Place ID Finder</a>, escribe el nombre del negocio y copia el ID que empieza con <b>ChIJ</b>.</p>
  <div class="gbox" id="gbox" hidden>
    <span>Link de reseñas generado</span>
    <code id="gout"></code>
    <div class="gact"><button type="button" class="b alt" id="gcp">Copiar</button><a class="b alt" id="gts" target="_blank" rel="noopener">Probar</a></div>
  </div>
  <div class="row">
    <label class="f"><span>Instagram</span><input id="ig" placeholder="@usuario"></label>
    <label class="f"><span>TikTok</span><input id="tt" placeholder="@usuario"></label>
    <label class="f"><span>Facebook</span><input id="fb" placeholder="usuario o link"></label>
    <label class="f"><span>WhatsApp</span><input id="wa" inputmode="tel" placeholder="56912345678"></label>
    <label class="f"><span>Sitio web</span><input id="web" placeholder="minegocio.cl"></label>
    <label class="f"><span>Teléfono</span><input id="ph" inputmode="tel" placeholder="+56 9 1234 5678"></label>
  </div>
  <label class="f"><span>Link de Google Maps (cómo llegar)</span><input id="mp" placeholder="https://maps.app.goo.gl/..."></label>
  <label class="f"><span>Color de fondo de la página</span><input id="c" type="color" value="#d4382c"></label>
  <label class="f"><span>Código GoatCounter para contar visitas (opcional)</span><input id="gc" placeholder="minegocio"></label>
  <label class="f"><span>URL final de la página, cuando ya esté publicada (para el QR)</span><input id="fu" inputmode="url" placeholder="https://minegocio.netlify.app"></label>

  <div class="acts">
    <button class="b" id="bdl">Descargar página del cliente (.html)</button>
    <button class="b alt" id="bcp">Copiar link de demostración</button>
    <button class="b alt" id="bsh">Compartir link de demostración</button>
  </div>
  <div id="msg" role="status"></div>
  <p class="hlp" id="lenhint"></p>

  <div class="ptitle">Código QR</div>
  <div id="qrbox"></div>
  <button class="b alt" id="bqr" style="width:100%">Descargar QR (.png)</button>

  <div class="ptitle">Vista previa</div>
  <div class="prev" id="pv"></div>
</div>
<div id="app"></div>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var enc=function(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))};
var dec=function(s){return JSON.parse(decodeURIComponent(escape(atob(s))))};
var FIELDS=['n','t','g','ig','tt','fb','wa','web','ph','mp','c','gc'];
function strip(v,re){var m=v.match(re);return m?m[1]:v;}
function pack(o){
  var vals=FIELDS.map(function(k){
    var v=(o[k]||'').trim(); if(!v) return '';
    var url=/^https?:\/\//i.test(v);
    if(k==='c') v=v.replace('#','');
    else if(k==='ig') v=strip(v,/^https?:\/\/(?:www\.)?instagram\.com\/@?([^\/?#]+)\/?(?:[?#].*)?$/i).replace(/^@/,'');
    else if(k==='tt') v=strip(v,/^https?:\/\/(?:www\.)?tiktok\.com\/@([^\/?#]+)\/?(?:[?#].*)?$/i).replace(/^@/,'');
    else if(k==='fb') v=strip(v,/^https?:\/\/(?:www\.)?facebook\.com\/([^\/?#]+)\/?$/i);
    else if(k==='web') v=v.replace(/^https:\/\//i,'').replace(/\/$/,'');
    else if((k==='wa')&&!url) v=v.replace(/\D/g,'');
    else if((k==='ph')&&!url) v=v.replace(/[^\d+]/g,'');
    return encodeURIComponent(v).replace(/~/g,'%7E');
  });
  while(vals.length&&!vals[vals.length-1]) vals.pop();
  return vals.join('~');
}
function unpack(s){
  var p=s.split('~'),o={};
  FIELDS.forEach(function(k,i){
    var v=p[i]?decodeURIComponent(p[i]):'';
    if(v){ if(k==='c') v='#'+v; o[k]=v; }
  });
  return o;
}

function link(k,v){
  v=(v||'').trim(); if(!v) return '';
  if(/^https?:\/\//i.test(v)) return v;
  v=v.replace(/^@/,'');
  if(k==='ig') return 'https://instagram.com/'+v;
  if(k==='tt') return 'https://tiktok.com/@'+v;
  if(k==='fb') return 'https://facebook.com/'+v;
  if(k==='wa') return 'https://wa.me/'+v.replace(/\D/g,'');
  if(k==='ph') return 'tel:'+v.replace(/[^\d+]/g,'');
  if(k==='g') return 'https://search.google.com/local/writereview?placeid='+encodeURIComponent(v);
  return 'https://'+v;
}
function onColor(hex){
  var h=(hex||'#111111').replace('#','');
  var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
  return (0.299*r+0.587*g+0.114*b)>160?'#111':'#fff';
}
var ICONS={
ig:'<svg viewBox="0 0 24 24" aria-hidden="true"><defs><radialGradient id="igg" cx="30%" cy="107%" r="150%"><stop offset="0" stop-color="#fdf497"/><stop offset=".05" stop-color="#fdf497"/><stop offset=".45" stop-color="#fd5949"/><stop offset=".6" stop-color="#d6249f"/><stop offset=".9" stop-color="#285AEB"/></radialGradient></defs><rect width="24" height="24" rx="6" fill="url(#igg)"/><rect x="5.5" y="5.5" width="13" height="13" rx="4" fill="none" stroke="#fff" stroke-width="1.7"/><circle cx="12" cy="12" r="3.2" fill="none" stroke="#fff" stroke-width="1.7"/><circle cx="16.2" cy="7.8" r="1" fill="#fff"/></svg>',
tt:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#000"/><g transform="translate(2.4 3) scale(.8)"><path id="ttn" d="M16.6 5.6c-.7-.6-1.1-1.5-1.1-2.5h-2.6v11.1c0 1.2-1 2.2-2.2 2.2s-2.2-1-2.2-2.2 1-2.2 2.2-2.2c.2 0 .5 0 .7.1V9.4c-.2 0-.5-.1-.7-.1-2.7 0-4.8 2.2-4.8 4.9s2.2 4.9 4.8 4.9 4.9-2.2 4.9-4.9V9.1c1 .7 2.1 1.1 3.3 1.1V7.6c-.9 0-1.7-.7-2.3-2z" fill="#25F4EE" transform="translate(-.7 -.7)"/><path d="M16.6 5.6c-.7-.6-1.1-1.5-1.1-2.5h-2.6v11.1c0 1.2-1 2.2-2.2 2.2s-2.2-1-2.2-2.2 1-2.2 2.2-2.2c.2 0 .5 0 .7.1V9.4c-.2 0-.5-.1-.7-.1-2.7 0-4.8 2.2-4.8 4.9s2.2 4.9 4.8 4.9 4.9-2.2 4.9-4.9V9.1c1 .7 2.1 1.1 3.3 1.1V7.6c-.9 0-1.7-.7-2.3-2z" fill="#FE2C55" transform="translate(.7 .7)"/><path d="M16.6 5.6c-.7-.6-1.1-1.5-1.1-2.5h-2.6v11.1c0 1.2-1 2.2-2.2 2.2s-2.2-1-2.2-2.2 1-2.2 2.2-2.2c.2 0 .5 0 .7.1V9.4c-.2 0-.5-.1-.7-.1-2.7 0-4.8 2.2-4.8 4.9s2.2 4.9 4.8 4.9 4.9-2.2 4.9-4.9V9.1c1 .7 2.1 1.1 3.3 1.1V7.6c-.9 0-1.7-.7-2.3-2z" fill="#fff"/></g></svg>',
fb:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#1877F2"/><path d="M13.5 20v-6.5h2.2l.4-2.7h-2.6V9.1c0-.8.3-1.3 1.4-1.3h1.3V5.4c-.2 0-1-.1-1.9-.1-2 0-3.3 1.2-3.3 3.4v1.9H8.8v2.7H11V20z" fill="#fff"/></svg>',
wa:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#25D366"/><path d="M12 5a7 7 0 0 0-6 10.6L5 19l3.500-.9A7 7 0 1 0 12 5z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.300 8.800c.2-.4.4-.4.600-.4h.4c.1 0 .3 0 .4.300l.600 1.400c0 .2 0 .3-.1.400l-.4.500c-.1.1-.1.200 0 .400.4.700 1.300 1.600 2.200 2 .2.100.3.100.4 0l.6-.7c.1-.1.3-.2.5-.1l1.400.7c.2.1.3.2.3.3 0 .5-.2 1.100-.8 1.400-.5.300-1.100.4-1.800.2-1.800-.5-3.200-1.600-4.200-3.100-.6-.9-.9-1.800-.6-2.700z" fill="#fff"/></svg>',
web:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#4285F4"/><g fill="none" stroke="#fff" stroke-width="1.5"><circle cx="12" cy="12" r="7"/><ellipse cx="12" cy="12" rx="3" ry="7"/><path d="M5 12h14"/></g></svg>',
mp:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="12" fill="#fff"/><path d="M12 2.500a6.500 6.500 0 0 0-6.500 6.500c0 4.700 6.500 12.500 6.500 12.500s6.500-7.800 6.500-12.500A6.500 6.500 0 0 0 12 2.500z" fill="#EA4335"/><circle cx="12" cy="9" r="2.500" fill="#fff"/></svg>',
ph:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#34C759"/><path d="M8 6.500l2-.6 1.200 2.900-1.300 1c.7 1.500 1.800 2.600 3.300 3.300l1-1.300 2.900 1.200-.6 2c-.2.700-.9 1.100-1.600 1C9.800 15.500 7.700 13.300 6.900 8.100c-.1-.7.300-1.400 1.100-1.600z" fill="#fff"/></svg>'
};
function render(cfg,el,live){
  var ac=cfg.c||'#d4382c';
  el.style.setProperty('--ac',ac);
  el.style.setProperty('--on',onColor(ac));
  el.style.background=ac;
  var rows=[['ig','Instagram'],['tt','TikTok'],['fb','Facebook'],['wa','WhatsApp'],['web','Sitio web'],['mp','Cómo llegar'],['ph','Llamar']];
  var G='<span style="color:#4285F4">G</span><span style="color:#EA4335">o</span><span style="color:#FBBC04">o</span><span style="color:#4285F4">g</span><span style="color:#34A853">l</span><span style="color:#EA4335">e</span>';
  var h='<div class="pg"><h2>'+esc(cfg.n||'Nombre del negocio')+'</h2><p class="t">'+esc(cfg.t||'Gracias por visitarnos')+'</p>';
  var g=link('g',cfg.g);
  if(g) h+='<a class="cta" href="'+esc(g)+'"><i aria-hidden="true">★★★★★</i><b>Déjanos tu reseña en '+G+'</b><small>Toma menos de un minuto</small></a>';
  rows.forEach(function(r){
    var u=link(r[0],cfg[r[0]]);
    if(u) h+='<a class="lk" href="'+esc(u)+'">'+ICONS[r[0]]+'<span>'+r[1]+'</span></a>';
  });
  el.innerHTML=h+'</div>';
  if(!live){
    document.body.style.background=ac;
    el.style.minHeight='100vh';
    if(cfg.gc){
      var s=document.createElement('script');
      s.async=true;s.src='https://gc.zgo.at/count.js';
      s.setAttribute('data-goatcounter','https://'+cfg.gc.replace(/[^a-z0-9-]/gi,'')+'.goatcounter.com/count');
      document.head.appendChild(s);
    }
  }
}

var cfg=null;
try{var t=$('#cfg').textContent.trim(); if(t) cfg=JSON.parse(t);}catch(e){}
if(!cfg && /^#p=/.test(location.hash)){ try{cfg=unpack(location.hash.slice(3));}catch(e){} }
if(!cfg && /^#d=/.test(location.hash)){ try{cfg=dec(location.hash.slice(3));}catch(e){} }

if(cfg){
  document.title=cfg.n||'Página del negocio';
  var gn=$('#gen'); if(gn) gn.style.display='none';
  render(cfg,$('#app'),false);
  return;
}

/* ---- Modo creador ---- */
var msg=function(t){$('#msg').textContent=t;};
function read(){var o={};FIELDS.forEach(function(k){var v=$('#'+k).value.trim(); if(v) o[k]=v;});return o;}
function demoLink(o){return location.href.split('#')[0]+'#p='+pack(o);}
function drawQR(url){
  var box=$('#qrbox');
  try{
    var q=qrcode(0,'M'); q.addData(url); q.make();
    box.innerHTML='<img alt="Código QR" src="'+q.createDataURL(6,4)+'">';
    $('#bqr').style.display='';
  }catch(e){
    box.textContent='El link es muy largo para un QR. Publica la página y escribe su URL final arriba.';
    $('#bqr').style.display='none';
  }
}
var timer;
function update(){
  var o=read();
  render(o,$('#pv'),true);
  var gl=link('g',o.g);
  $('#gbox').hidden=!gl;
  $('#gout').textContent=gl;
  if(gl) $('#gts').href=gl;
  clearTimeout(timer);
  timer=setTimeout(function(){
    var fu=$('#fu').value.trim();
    var fl=fu||demoLink(o);
    drawQR(fl);
    var n=fl.length,h=n+' caracteres. ';
    if(n<=130) h+='Cabe en cualquier tarjeta NFC (NTAG213 o mayor).';
    else if(n<=490) h+='Necesitas tarjeta NTAG215 o NTAG216, o <a href="https://is.gd" target="_blank" rel="noopener">acorta el link en is.gd</a> (queda de unos 20 caracteres y cabe en cualquier tarjeta).';
    else h+='Es demasiado largo para casi todas las tarjetas: <a href="https://is.gd" target="_blank" rel="noopener">acórtalo en is.gd</a> antes de grabarlo.';
    $('#lenhint').innerHTML=h;
  },250);
}
FIELDS.concat(['fu']).forEach(function(k){$('#'+k).addEventListener('input',update);});

$('#bdl').onclick=function(){
  var o=read();
  if(!o.n){msg('Escribe primero el nombre del negocio.');return;}
  var c=document.documentElement.cloneNode(true);
  c.querySelector('body').innerHTML='<div id="app"></div>';
  c.querySelector('#cfg').textContent=JSON.stringify(o).replace(/</g,'\\u003c');
  var html='<!DOCTYPE html>\n'+c.outerHTML;
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  a.download=(o.n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'pagina')+'.html';
  document.body.appendChild(a);a.click();a.remove();
  msg('Descargada. Súbela a Netlify o Cloudflare Pages como index.html.');
};
$('#bcp').onclick=function(){
  var u=demoLink(read());
  (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){msg('Link copiado.');},function(){window.prompt('Copia el link:',u);});
};
$('#bsh').onclick=function(){
  var u=demoLink(read());
  if(navigator.share){navigator.share({title:read().n||'Página',url:u}).catch(function(){});}
  else{window.prompt('Copia el link:',u);}
};
$('#gcp').onclick=function(){
  var u=$('#gout').textContent;
  (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){msg('Link de reseñas copiado.');},function(){window.prompt('Copia el link:',u);});
};
$('#bqr').onclick=function(){
  var img=$('#qrbox img'); if(!img) return;
  var a=document.createElement('a'); a.href=img.src; a.download='qr.png';
  document.body.appendChild(a);a.click();a.remove();
};
update();
})();
</script>
</body>
</html>
